services:
  api:
    build: ./backend
    environment:
      ZHUATECH_DIGITAL_HUMAN_PROVIDER: ${ZHUATECH_DIGITAL_HUMAN_PROVIDER:-local}
      ZHUATECH_DIGITAL_HUMAN_BASE_URL: ${ZHUATECH_DIGITAL_HUMAN_BASE_URL:-}
      ZHUATECH_DIGITAL_HUMAN_MODEL: ${ZHUATECH_DIGITAL_HUMAN_MODEL:-digital-human-provider-model}
      ZHUATECH_DIGITAL_HUMAN_API_KEY: ${ZHUATECH_DIGITAL_HUMAN_API_KEY:-}
    ports: ["8080:8080"]
  web:
    image: nginx:1.27-alpine
    volumes: ["./frontend:/usr/share/nginx/html:ro"]
    ports: ["8088:80"]
